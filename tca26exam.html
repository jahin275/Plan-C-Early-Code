<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan C — Exam Portal</title>
<link rel="icon" href="C.png">
<style>
:root{
  --bg:#070a12;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --txt:#e9eefc;
  --muted:#8a99b8;
  --cyan:#22d3ee;
  --violet:#a78bfa;
  --pink:#f472b6;
  --amber:#fcd34d;
  --green:#34d399;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 10% -12%, rgba(34,211,238,.16), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(167,139,250,.16), transparent 62%),
    radial-gradient(760px 620px at 50% 112%, rgba(52,211,153,.09), transparent 62%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 78%);
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}

/* LOGO */
.logo{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  display:grid;place-items:center;position:relative;
  background:linear-gradient(140deg,rgba(34,211,238,.22),rgba(167,139,250,.22));
  border:1px solid var(--line-2);
  box-shadow:0 6px 20px rgba(34,211,238,.12), inset 0 0 24px rgba(167,139,250,.10);
  overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:contain;padding:5px;display:block}
.logo .logo-fallback{
  display:none;font-weight:900;font-size:22px;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo.fallback .logo-fallback{display:block}

/* LOADER */
.loader{
  position:fixed;inset:0;z-index:999;
  display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 600px at 50% 20%, #0c1524 0%, #05070d 70%);
  transition:opacity .6s ease, transform .6s ease, visibility .6s;
  overflow-y:auto;
}
.loader.hidden{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
.loader-panel{
  width:min(430px,94vw);
  background:rgba(13,19,31,.86);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  animation:pop .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand h1 span{
  display:block;font-size:11px;font-weight:600;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--muted);margin-top:4px;
}
.status{margin:0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.status .dot{
  width:7px;height:7px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);animation:pulse 1.3s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.game-wrap{position:relative;display:grid;gap:10px;justify-items:center}
#snake{
  width:100%;max-width:320px;aspect-ratio:1/1;display:block;
  border-radius:16px;border:1px solid var(--line);
  background:#080c16;touch-action:none;cursor:pointer;
  box-shadow:inset 0 0 40px rgba(34,211,238,.06);
}
.game-hud{
  width:100%;max-width:320px;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:1.6px;color:var(--muted);font-weight:700;
}
.game-hud b{color:var(--cyan);font-weight:800}
.hint{margin:0;font-size:11px;color:#5d6b88;text-align:center;letter-spacing:.3px}
.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:18px 0 14px}
.bar{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  transition:width .5s ease;position:relative;
}
.bar.loading{width:38%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.enter{
  width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line-2);
  background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(167,139,250,.16));
  font-weight:800;letter-spacing:.4px;font-size:14px;cursor:pointer;
  transition:.25s;opacity:1;
}
.enter:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(34,211,238,.5)}
.enter.ready{
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#04121a;border-color:transparent;
}
.enter:disabled{cursor:progress;opacity:.5}
.error{margin:12px 0 0;font-size:12px;color:#ff9aa2;line-height:1.55;text-align:center;display:none}
.error.show{display:block}

/* VIEWS */
.view{display:block}

/* LOGIN FORM */
.login-form{display:grid;gap:10px;margin-top:6px}
.login-form input{
  width:100%;padding:13px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line-2);
  outline:none;font-size:14px;transition:.2s;
}
.login-form input::placeholder{color:#5d6b88}
.login-form input:focus{
  border-color:rgba(34,211,238,.55);
  background:rgba(34,211,238,.06);
  box-shadow:0 0 0 4px rgba(34,211,238,.08);
}

/* APP */
.app{position:relative;z-index:1;opacity:0;transition:opacity .6s ease .15s}
body.ready .app{opacity:1}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(7,10,18,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1400px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand-text span{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.topbar .logo{width:38px;height:38px;border-radius:12px}
.search{flex:1 1 240px;min-width:180px;position:relative;display:flex;align-items:center}
.search svg{
  position:absolute;left:13px;width:16px;height:16px;stroke:var(--muted);fill:none;
  stroke-width:2;pointer-events:none;
}
.search input{
  width:100%;padding:11px 14px 11px 38px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  outline:none;font-size:13.5px;transition:.2s;
}
.search input::placeholder{color:#5d6b88}
.search input:focus{
  border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06);
  box-shadow:0 0 0 4px rgba(34,211,238,.08);
}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{
  display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:3px;gap:2px;
}
.seg button{
  border:0;background:transparent;padding:7px 12px;border-radius:9px;
  font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.18s;letter-spacing:.2px;
}
.seg button:hover{color:var(--txt)}
.seg button.active{
  background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(167,139,250,.22));
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
}
select{
  padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;outline:none;
}
select:focus{border-color:rgba(34,211,238,.5)}
select option{background:#0e1420;color:#e9eefc}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);cursor:pointer;font-size:16px;
  display:grid;place-items:center;transition:.2s;
}
.icon-btn:hover{border-color:rgba(34,211,238,.5);color:var(--cyan)}
#reload:hover{transform:rotate(90deg)}
#calBtn:hover{transform:scale(1.05)}
#signOut:hover{color:#f472b6;border-color:rgba(244,114,182,.5)}

.chips{
  max-width:1400px;margin:0 auto;padding:0 18px 12px;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap;
}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.active{
  color:#04121a;border-color:transparent;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:0 6px 18px rgba(34,211,238,.22);
}
main{max-width:1400px;margin:0 auto;padding:22px 18px 80px}
.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap;gap:8px;letter-spacing:.3px;
}
.meta b{color:var(--txt);font-weight:800}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.card{
  position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  display:flex;flex-direction:column;gap:12px;
  transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,hsl(var(--h) 90% 62%),transparent 70%);
  opacity:.65;
}
.card:hover{
  transform:translateY(-4px);
  border-color:hsl(var(--h) 80% 60% / .45);
  box-shadow:0 18px 42px rgba(0,0,0,.45), 0 0 0 1px hsl(var(--h) 80% 60% / .12);
}
.card.locked{opacity:.78}
.card.locked::before{background:linear-gradient(90deg,#fcd34d,transparent 70%);opacity:.6}
.card.live{
  border-color:rgba(52,211,153,.55);
  box-shadow:0 0 0 1px rgba(52,211,153,.18), 0 18px 42px rgba(52,211,153,.08);
}
.card.live::before{background:linear-gradient(90deg,#34d399,transparent 70%);opacity:1}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{
  font-size:11px;font-weight:800;letter-spacing:.6px;padding:5px 11px;border-radius:8px;
  border:1px solid transparent;white-space:nowrap;
}
.badge.daily{background:rgba(34,211,238,.13);color:#67e8f9;border-color:rgba(34,211,238,.28)}
.badge.weekly{background:rgba(251,191,36,.13);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.badge.monthly{background:rgba(167,139,250,.14);color:#c4b5fd;border-color:rgba(167,139,250,.3)}
.badge.other{background:rgba(255,255,255,.07);color:var(--muted);border-color:var(--line)}
.subject{
  font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  padding:5px 10px;border-radius:8px;white-space:nowrap;
  color:hsl(var(--h) 85% 72%);
  background:hsl(var(--h) 80% 55% / .12);
  border:1px solid hsl(var(--h) 80% 60% / .28);
}
.syllabus{
  margin:0;font-size:13.2px;line-height:1.62;color:#c3cee6;
  white-space:pre-line;word-break:break-word;
  max-height:8.1em;overflow:hidden;transition:max-height .35s ease;position:relative;
}
.card.expanded .syllabus{max-height:2200px}
.card.has-more:not(.expanded) .syllabus{
  mask-image:linear-gradient(#000 62%,transparent 100%);
  -webkit-mask-image:linear-gradient(#000 62%,transparent 100%);
}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:10px;flex-direction:column}

/* LIVE BANNER */
.live-banner{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:7px 12px;border-radius:10px;
  background:linear-gradient(90deg,rgba(52,211,153,.16),rgba(52,211,153,.06));
  border:1px solid rgba(52,211,153,.35);
  font-size:11.5px;font-weight:800;letter-spacing:.5px;color:#6ee7b7;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:#34d399;
  box-shadow:0 0 12px #34d399;animation:pulse 1.1s infinite;
}
.live-banner .cd{color:#fff;font-variant-numeric:tabular-nums;font-weight:900}

.open-btn{
  width:100%;text-align:center;padding:11px 14px;border-radius:12px;
  font-size:12.8px;font-weight:800;letter-spacing:.3px;
  background:linear-gradient(135deg,hsl(var(--h) 85% 60% / .18),rgba(255,255,255,.03));
  border:1px solid hsl(var(--h) 80% 60% / .35);
  color:hsl(var(--h) 90% 78%);
  transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.open-btn:hover{
  background:linear-gradient(135deg,hsl(var(--h) 90% 62%),hsl(var(--h) 90% 48%));
  color:#04121a;border-color:transparent;transform:translateY(-1px);
  box-shadow:0 8px 22px hsl(var(--h) 85% 55% / .3);
}
.open-btn .arw{transition:transform .2s}
.open-btn:hover .arw{transform:translate(2px,-2px)}
.open-btn.disabled{
  background:rgba(255,255,255,.03);border:1px dashed var(--line-2);
  color:#5d6b88;cursor:not-allowed;pointer-events:none;
}
.open-btn.locked{
  background:linear-gradient(135deg,rgba(251,191,36,.09),rgba(255,255,255,.02));
  border:1px solid rgba(251,191,36,.35);
  color:var(--amber);cursor:not-allowed;pointer-events:none;
  font-variant-numeric:tabular-nums;
}
.open-btn.locked .cd{
  font-weight:900;color:#fff;text-shadow:0 0 12px rgba(251,191,36,.55);
  margin-left:2px;font-variant-numeric:tabular-nums;
}
.open-btn.practice{
  background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(255,255,255,.02));
  border:1px solid rgba(167,139,250,.35);
  color:#c4b5fd;
}
.open-btn.practice:hover{
  background:linear-gradient(135deg,var(--violet),#8b5cf6);
  color:#04121a;border-color:transparent;
}

.more-btn{
  border:0;background:transparent;color:var(--cyan);font-size:11.5px;font-weight:800;
  cursor:pointer;padding:0;letter-spacing:.4px;text-align:left;align-self:flex-start;display:none;
}
.more-btn:hover{text-decoration:underline}
.card.has-more .more-btn{display:block}
.group{margin-bottom:34px}
.group-title{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:hsl(var(--h) 85% 72%);margin:0 0 14px;
}
.group-title::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,hsl(var(--h) 80% 60% / .35),transparent);
}
.group-title span{
  font-size:10.5px;padding:3px 9px;border-radius:99px;
  background:hsl(var(--h) 80% 55% / .14);color:hsl(var(--h) 85% 75%);letter-spacing:.5px;
}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty strong{display:block;font-size:17px;color:var(--txt);margin-bottom:8px}
.empty span{font-size:13px}
footer{
  text-align:center;padding:26px 18px 40px;font-size:11.5px;color:#4d5a75;
  letter-spacing:.6px;position:relative;z-index:1;
}
footer b{
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;
}

/* CALENDAR MODAL */
.cal-modal{
  position:fixed;inset:0;z-index:800;
  display:none;place-items:center;padding:20px;
  background:rgba(5,7,13,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.cal-modal.open{display:grid;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cal-panel{
  width:min(620px,96vw);
  background:rgba(13,19,31,.96);
  border:1px solid var(--line-2);
  border-radius:24px;
  padding:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.cal-head h3{
  margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:34px;height:34px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--muted);cursor:pointer;font-size:16px;font-weight:800;
  display:grid;place-items:center;transition:.18s;
}
.cal-nav button:hover{color:var(--cyan);border-color:rgba(34,211,238,.5)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{
  text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1px;
  color:#5d6b88;padding:6px 0;text-transform:uppercase;
}
.cal-day{
  min-height:64px;
  border-radius:11px;
  padding:5px 5px 6px;
  display:flex;flex-direction:column;gap:3px;
  align-items:flex-start;justify-content:flex-start;
  font-size:12px;font-weight:700;color:var(--muted);
  border:1px solid transparent;cursor:default;position:relative;
  transition:.18s;
}
.cal-day.blank{visibility:hidden}
.cal-day.has{
  color:var(--txt);cursor:pointer;
  background:rgba(255,255,255,.04);
  border-color:var(--line);
}
.cal-day.has:hover{
  background:rgba(34,211,238,.08);
  border-color:rgba(34,211,238,.45);
}
.cal-day.today{
  outline:2px solid rgba(34,211,238,.5);
  outline-offset:-2px;
}
.cal-day .d-num{
  font-size:11.5px;font-weight:800;line-height:1;
  color:var(--muted);
}
.cal-day.has .d-num{ color:var(--txt); }
.cal-day.today .d-num{ color:var(--cyan); }

.cal-day .mini{
  font-size:8.5px;font-weight:800;letter-spacing:.2px;
  padding:1.5px 5px;border-radius:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
  line-height:1.3;
}
.cal-day .mini.up{   background:rgba(251,191,36,.18); color:#fcd34d; border:1px solid rgba(251,191,36,.4); }
.cal-day .mini.live{ background:rgba(52,211,153,.18); color:#6ee7b7; border:1px solid rgba(52,211,153,.4); }
.cal-day .mini.past{ background:rgba(167,139,250,.16); color:#c4b5fd; border:1px solid rgba(167,139,250,.35); }

.cal-day .mini.live::before{
  content:'● ';
  font-size:6px;
  vertical-align:middle;
  animation:pulse 1.1s infinite;
}

.cal-day .more{
  font-size:8px;color:var(--muted);font-weight:800;
  padding-left:2px;letter-spacing:.3px;
}

.cal-legend{
  display:flex;gap:14px;justify-content:center;margin-top:14px;
  font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;
}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:7px;height:7px;border-radius:3px;display:block}
.cal-legend i.up{background:#fcd34d}
.cal-legend i.live{background:#34d399}
.cal-legend i.past{background:#a78bfa}
.cal-close{
  width:100%;margin-top:14px;padding:11px;
  border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--muted);
  font-size:12px;font-weight:800;letter-spacing:.6px;cursor:pointer;
  transition:.2s;
}
.cal-close:hover{color:var(--txt);border-color:var(--line-2)}

<script>
/* ═══════════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════════ */
const API_URL = "https://script.google.com/macros/s/AKfycbw8Y6JUXLxV9kfmW6RJyJnpA7dMyUNzL2ZL95n-zOZki9K8lEESoVTHoe9PQ3lzoELv8A/exec";
const LIVE_WINDOW_MS = 24 * 60 * 60 * 1000;

/* ═══════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════ */
const state = { all:[], q:"", subject:"All", type:"All", sort:"sheet", user:null };
let ready = false;

/* ═══════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

function hueOf(s){
  let h = 0;
  for(let i = 0; i < (s||"").length; i++) h = (h*31 + s.charCodeAt(i)) % 360;
  return h;
}

function fmtDuration(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if(d > 0) return `${d}d ${h}h ${m}m`;
  if(h > 0) return `${h}h ${m}m ${sec}s`;
  if(m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function parseDate(str){
  if(!str) return null;
  if(str instanceof Date) return str;
  if(typeof str === "number") return new Date(str);
  str = String(str).trim();
  if(!str) return null;
  let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);
  m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

/* ═══════════════════════════════════════════════════════════════════
   BACKEND
   ═══════════════════════════════════════════════════════════════════ */
async function login(email, code){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"login", email, code }),
    redirect: "follow",
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch(e){ throw new Error("Server didn't return JSON. Redeploy the Apps Script as a Web App (access: Anyone)."); }
  if(!json.ok) throw new Error(json.error || "Not authorized.");
  return json;
}

function normalizeRow(raw, i){
  const g = (obj, ...keys) => {
    for(const k of keys){
      if(obj[k] != null && String(obj[k]).trim() !== "") return String(obj[k]).trim();
      const hit = Object.keys(obj).find(x => x.toLowerCase() === k.toLowerCase());
      if(hit && obj[hit] != null) return String(obj[hit]).trim();
    }
    return "";
  };

  const index    = g(raw, "index", "Index");
  const syllabus = g(raw, "syllabus", "Syllabus");
  const link     = g(raw, "examlink", "Exam Link", "ExamLink", "link", "url");
  let   subject  = g(raw, "subject", "Subject") || "All";

  const subMap = {
    "statisitcs":"Statistics","statistics":"Statistics","stat":"Statistics",
    "econ":"Economics","economics":"Economics",
    "hm":"Higher Math","highermath":"Higher Math","higher math":"Higher Math",
    "bangla":"Bangla","english":"English","ict":"ICT","all":"All"
  };
  const key = subject.toLowerCase().replace(/[^a-z ]/g,"").trim();
  if(subMap[key]) subject = subMap[key];

  if(!index && !syllabus) return null;

  const m = index.match(/^\s*(Weekly|Daily|Monthly)\s*(\d+)/i);
  const type = m ? (m[1][0].toUpperCase() + m[1].slice(1).toLowerCase()) : "Other";
  const num  = m ? +m[2] : 9999;

  const startRaw = g(raw, "Exam Start", "Exam Starts", "exam start", "starts", "start");
  const starts   = parseDate(startRaw);

  return { index, syllabus, link, subject, type, num, starts, order:i };
}

/* ═══════════════════════════════════════════════════════════════════
   EXAM STATE
   ═══════════════════════════════════════════════════════════════════ */
function examState(r){
  const now = Date.now();
  const start = r.starts ? r.starts.getTime() : null;
  if(!start) return "unlocked";
  if(now < start) return "locked";
  if(now < start + LIVE_WINDOW_MS) return "live";
  return "unlocked";
}

/* ═══════════════════════════════════════════════════════════════════
   SNAKE
   ═══════════════════════════════════════════════════════════════════ */
const Snake = (() => {
  const N = 16, SIZE = 320, STEP = 118;
  let canvas, ctx, cell, raf, last = 0, acc = 0;
  let snake, dir, queue, food, score, best, dead, deadAt = 0, alive = false;
  let scoreEl, bestEl;
  let bound = false;

  function init(cv, sEl, bEl){
    canvas = cv; scoreEl = sEl; bestEl = bEl;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = SIZE * dpr;
    canvas.height = SIZE * dpr;
    ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    cell = SIZE / N;
    best = +(localStorage.getItem("planc_snake_best") || 0);
    bestEl.textContent = best;
    if(!bound){ bindControls(); bound = true; }
    reset();
  }

  function start(){
    if(alive) return;
    alive = true;
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function stop(){
    alive = false;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function reset(){
    snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir = {x:1,y:0}; queue = [];
    score = 0; dead = false; acc = 0;
    placeFood();
    if(scoreEl) scoreEl.textContent = "0";
  }

  function placeFood(){
    let guard = 0;
    do {
      food = { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N) };
      guard++;
    } while(guard < 400 && snake.some(s => s.x === food.x && s.y === food.y));
  }

  function push(d){
    if(!alive) return;
    const ref = queue.length ? queue[queue.length-1] : dir;
    if(d.x === -ref.x && d.y === -ref.y) return;
    if(d.x ===  ref.x && d.y ===  ref.y) return;
    if(queue.length < 2) queue.push(d);
  }

  function step(){
    if(queue.length){
      const d = queue.shift();
      if(!(d.x === -dir.x && d.y === -dir.y)) dir = d;
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    const eating  = head.x === food.x && head.y === food.y;
    const body    = eating ? snake : snake.slice(0, -1);
    const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
    if(hitWall || hitSelf){ dead = true; deadAt = performance.now(); return; }
    snake.unshift(head);
    if(eating){
      score++;
      scoreEl.textContent = score;
      if(score > best){ best = score; bestEl.textContent = best; localStorage.setItem("planc_snake_best", best); }
      placeFood();
    } else snake.pop();
  }

  function rrect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw(){
    if(!ctx) return;
    ctx.fillStyle = "#080c16";
    ctx.fillRect(0,0,SIZE,SIZE);

    ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1;
    for(let i=1;i<N;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,SIZE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(SIZE,i*cell); ctx.stroke();
    }

    if(food){
      const fx = food.x*cell, fy = food.y*cell;
      ctx.save();
      ctx.shadowColor = "#f472b6"; ctx.shadowBlur = 16;
      ctx.fillStyle = "#f472b6";
      rrect(fx + cell*0.22, fy + cell*0.22, cell*0.56, cell*0.56, cell*0.28);
      ctx.fill();
      ctx.restore();
    }

    for(let i = snake.length - 1; i >= 0; i--){
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const hue   = 185 + t * 80;
      const light = i === 0 ? 66 : 58 - t * 12;
      ctx.save();
      if(i === 0){ ctx.shadowColor = "#22d3ee"; ctx.shadowBlur = 14; }
      ctx.fillStyle = `hsl(${hue} 88% ${light}%)`;
      const pad = i === 0 ? cell*0.06 : cell*0.13;
      rrect(s.x*cell + pad, s.y*cell + pad, cell - pad*2, cell - pad*2, cell*0.3);
      ctx.fill();
      ctx.restore();
    }

    if(snake.length && !dead){
      const h = snake[0];
      const cx = h.x*cell + cell/2, cy = h.y*cell + cell/2;
      const ox = dir.y !== 0 ? cell*0.2 : 0;
      const oy = dir.x !== 0 ? cell*0.2 : 0;
      const fx2 = dir.x * cell*0.16, fy2 = dir.y * cell*0.16;
      ctx.fillStyle = "#04121a";
      ctx.beginPath(); ctx.arc(cx + fx2 + ox, cy + fy2 + oy, cell*0.09, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + fx2 - ox, cy + fy2 - oy, cell*0.09, 0, 7); ctx.fill();
    }

    if(dead){
      ctx.fillStyle = "rgba(5,7,13,.78)";
      ctx.fillRect(0,0,SIZE,SIZE);
      ctx.textAlign = "center";
      ctx.fillStyle = "#f472b6";
      ctx.font = "800 22px Inter, system-ui, sans-serif";
      ctx.fillText("GAME OVER", SIZE/2, SIZE/2 - 8);
      ctx.fillStyle = "#8a99b8";
      ctx.font = "700 12px Inter, system-ui, sans-serif";
      ctx.fillText("SCORE " + score + "  ·  RESTARTING", SIZE/2, SIZE/2 + 18);
    }
  }

  function loop(t){
    if(!alive) return;
    raf = requestAnimationFrame(loop);
    const dt = Math.min(t - last, 200); last = t;
    if(!dead){
      acc += dt;
      while(acc >= STEP){ acc -= STEP; step(); if(dead) break; }
    } else if(t - deadAt > 1300) reset();
    draw();
  }

  function bindControls(){
    window.addEventListener("keydown", e => {
      if(!alive) return;
      const k = e.key;
      const loaderVisible = !document.getElementById("loader").classList.contains("hidden");
      if(loaderVisible && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
      if(k === "ArrowUp"    || k === "w" || k === "W") push({x:0,y:-1});
      else if(k === "ArrowDown"  || k === "s" || k === "S") push({x:0,y:1});
      else if(k === "ArrowLeft"  || k === "a" || k === "A") push({x:-1,y:0});
      else if(k === "ArrowRight" || k === "d" || k === "D") push({x:1,y:0});
    }, { passive:false });

    let sx=0, sy=0;
    canvas.addEventListener("touchstart", e => {
      const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY;
    }, { passive:true });
    canvas.addEventListener("touchend", e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if(Math.abs(dx) > Math.abs(dy)) push({ x: dx > 0 ? 1 : -1, y: 0 });
      else                            push({ x: 0, y: dy > 0 ? 1 : -1 });
    }, { passive:true });
  }

  return { init, start, stop };
})();

/* ═══════════════════════════════════════════════════════════════════
   UI REFS
   ═══════════════════════════════════════════════════════════════════ */
const loader     = $("#loader");
const enterBtn   = $("#enterBtn");
const bar        = $("#bar");
const loadStatus = $("#loadStatus");
const errorBox   = $("#errorBox");
const content    = $("#content");
const chipsEl    = $("#chips");
const metaEl     = $("#meta");
const searchEl   = $("#search");
const sortEl     = $("#sort");
const appEl      = $("#app");

/* ═══════════════════════════════════════════════════════════════════
   VIEW SWITCHING
   ═══════════════════════════════════════════════════════════════════ */
function showView(name){
  $("#viewLogin").style.display   = name === "login"   ? "block" : "none";
  $("#viewLoading").style.display = name === "loading" ? "block" : "none";
}

/* ═══════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
  // Init snake hidden, keep it stopped until login
  Snake.init($("#snake"), $("#score"), $("#best"));
  Snake.stop();
  showView("login");

  /* ═══ Lockdown: block right-click, drag, devtools, copy ═══ */
  document.addEventListener("contextmenu", e => { e.preventDefault(); return false; });
  document.addEventListener("dragstart",   e => { e.preventDefault(); return false; });

  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    const inField = ["INPUT","TEXTAREA"].includes(document.activeElement?.tagName);

    // F12
    if (e.key === "F12") { e.preventDefault(); return false; }

    // Ctrl+Shift+I / J / C / K
    if (e.ctrlKey && e.shiftKey && ["i","j","c","k"].includes(k)) {
      e.preventDefault(); return false;
    }

    // Ctrl+U / Ctrl+S / Ctrl+P
    if (e.ctrlKey && ["u","s","p"].includes(k)) { e.preventDefault(); return false; }

    // Ctrl+C / Ctrl+X / Ctrl+A outside inputs
    if (e.ctrlKey && ["c","x","a"].includes(k) && !inField) {
      e.preventDefault(); return false;
    }
  }, true);

  /* ── Login submit ── */
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("#emailInput").value.trim();
    const code  = $("#codeInput").value.trim();
    if(!email || !code) return;

    errorBox.classList.remove("show");
    showView("loading");
    Snake.start();

    await doLogin(email, code);
  });

  /* ── Enter portal ── */
  enterBtn.addEventListener("click", () => { if(ready) enterPortal(); });

  /* ── Reload ── */
  $("#reload").addEventListener("click", () => {
    if(!state.user) return;
    showView("loading");
    Snake.start();
    enterBtn.disabled = true;
    enterBtn.classList.remove("ready");
    enterBtn.textContent = "Preparing…";
    bar.className = "bar loading";
    bar.style.width = "38%";
    ready = false;
    doLogin(state.user.email, state.user.code, true);
  });

  /* ── Sign out ── */
  $("#signOut").addEventListener("click", () => {
    state.user = null; state.all = []; ready = false;
    location.reload();
  });

  /* ── Search / filters ── */
  searchEl.addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  sortEl.addEventListener("change", e => { state.sort = e.target.value; render(); });

  $("#typeSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    state.type = b.dataset.type;
    [...e.currentTarget.children].forEach(c => c.classList.toggle("active", c === b));
    render();
  });

  chipsEl.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if(!c) return;
    state.subject = c.dataset.subject;
    [...chipsEl.children].forEach(x => x.classList.toggle("active", x === c));
    render();
  });

  content.addEventListener("click", e => {
    const b = e.target.closest(".more-btn"); if(!b) return;
    const card = b.closest(".card");
    card.classList.toggle("expanded");
    b.textContent = card.classList.contains("expanded") ? "Show less ▴" : "Show more ▾";
  });

  window.addEventListener("keydown", e => {
    if(e.key === "/" && document.activeElement !== searchEl && loader.classList.contains("hidden")){
      e.preventDefault(); searchEl.focus();
    }
  });

  /* ── Calendar ── */
  $("#calBtn").addEventListener("click", openCalendar);
  $("#calClose").addEventListener("click", () => $("#calModal").classList.remove("open"));
  $("#calModal").addEventListener("click", e => {
    if(e.target === $("#calModal")) $("#calModal").classList.remove("open");
  });
  $("#calPrev").addEventListener("click", () => shiftCalMonth(-1));
  $("#calNext").addEventListener("click", () => shiftCalMonth(1));

  /* ── Live ticker ── */
  setInterval(tick, 1000);
});

/* ═══════════════════════════════════════════════════════════════════
   LOGIN FLOW
   ═══════════════════════════════════════════════════════════════════ */
async function doLogin(email, code, silent){
  bar.className = "bar loading";
  bar.style.width = "38%";
  bar.style.background = "linear-gradient(90deg,var(--cyan),var(--violet))";
  errorBox.classList.remove("show");
  loadStatus.innerHTML = '<span class="dot"></span> Verifying…';

  try{
    const json = await login(email, code);
    state.user = { email: json.email, code };
    state.all  = (json.exams || []).map(normalizeRow).filter(Boolean);

    bar.className = "bar";
    bar.style.width = "100%";

    buildChips();
    render();
    renderUpcoming();

    loadStatus.innerHTML = '<span class="dot"></span> ' + state.all.length + " entries loaded ✓";
    enterBtn.disabled = false;
    enterBtn.classList.add("ready");
    enterBtn.textContent = "Enter Portal →";
    ready = true;

  } catch(err){
    bar.className = "bar";
    bar.style.width = "100%";
    bar.style.background = "linear-gradient(90deg,#f472b6,#ef4444)";
    loadStatus.innerHTML = '<span class="dot" style="background:#f472b6;box-shadow:0 0 10px #f472b6"></span> Access denied';
    errorBox.textContent = err.message;
    errorBox.classList.add("show");

    Snake.stop();
    enterBtn.disabled = true;
    enterBtn.classList.remove("ready");
    enterBtn.textContent = "Preparing…";
    ready = false;

    setTimeout(() => {
      showView("login");
      loadStatus.innerHTML = '<span class="dot"></span> Sign in to continue';
      bar.className = "bar";
      bar.style.width = "0%";
    }, 900);
  }
}

function enterPortal(){
  loader.classList.add("hidden");
  document.body.classList.add("ready");
  appEl.setAttribute("aria-hidden","false");
  setTimeout(() => { loader.style.display = "none"; Snake.stop(); }, 700);
}

/* ═══════════════════════════════════════════════════════════════════
   CHIPS / FILTER
   ═══════════════════════════════════════════════════════════════════ */
function buildChips(){
  const subjects = [...new Set(state.all.map(r => r.subject).filter(Boolean))].sort();
  chipsEl.innerHTML =
    `<button class="chip active" data-subject="All">All Subjects</button>` +
    subjects.map(s =>
      `<button class="chip" data-subject="${esc(s)}" style="--h:${hueOf(s)}">${esc(s)}</button>`
    ).join("");
}

function getFiltered(){
  const q = state.q;
  let list = state.all.filter(r => {
    if(state.subject !== "All" && r.subject !== state.subject) return false;
    if(state.type    !== "All" && r.type    !== state.type)    return false;
    if(!q) return true;
    return (r.index + " " + r.syllabus + " " + r.subject).toLowerCase().includes(q);
  });

  const s = state.sort;
  if(s === "az"){
    list = [...list].sort((a,b) => a.index.localeCompare(b.index, undefined, { numeric:true }));
  } else if(s === "type"){
    const rank = { Daily:0, Weekly:1, Monthly:2, Other:3 };
    list = [...list].sort((a,b) =>
      (rank[a.type] - rank[b.type]) || (a.num - b.num) || (a.order - b.order));
  } else if(s === "subject"){
    list = [...list].sort((a,b) =>
      (a.subject || "~").localeCompare(b.subject || "~") || (a.order - b.order));
  } else {
    list = [...list].sort((a,b) => a.order - b.order);
  }
  return list;
}

/* ═══════════════════════════════════════════════════════════════════
   CARD
   ═══════════════════════════════════════════════════════════════════ */
function cardHTML(r){
  const hue = hueOf(r.subject);
  const typeClass = (r.type || "other").toLowerCase();
  const hasLink = /^https?:\/\//i.test(r.link || "");
  const st = examState(r);
  const now = Date.now();

  let footHTML = "";

  if(st === "locked"){
    const ms = r.starts.getTime() - now;
    footHTML = `<span class="open-btn locked" data-start="${r.starts.getTime()}">
        🔒 Opens in&nbsp;<span class="cd">${fmtDuration(ms)}</span>
      </span>`;
  } else if(st === "live"){
    const endMs = r.starts.getTime() + LIVE_WINDOW_MS;
    const left = endMs - now;
    const live = `<div class="live-banner">
        <span class="live-dot"></span> LIVE NOW · ends in <span class="cd" data-end="${endMs}">${fmtDuration(left)}</span>
      </div>`;
    const btn = hasLink
      ? `<a class="open-btn" href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">
           Start Exam <span class="arw">↗</span>
         </a>`
      : `<span class="open-btn disabled">Link coming soon</span>`;
    footHTML = live + btn;
  } else {
    const btn = hasLink
      ? `<a class="open-btn practice" href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">
           Practice <span class="arw">↗</span>
         </a>`
      : `<span class="open-btn disabled">Link coming soon</span>`;
    footHTML = btn;
  }

  return `
    <article class="card ${st}" style="--h:${hue}">
      <div class="card-top">
        <span class="badge ${typeClass}">${esc(r.index || "—")}</span>
        <span class="subject">${esc(r.subject || "General")}</span>
      </div>
      <p class="syllabus">${esc(r.syllabus || "—")}</p>
      <button class="more-btn" type="button">Show more ▾</button>
      <div class="card-foot">${footHTML}</div>
    </article>`;
}

function render(){
  const list = getFiltered();

  metaEl.innerHTML =
    `<span>Showing <b>${list.length}</b> of <b>${state.all.length}</b> entries</span>` +
    `<span>${state.subject === "All" ? "All subjects" : esc(state.subject)}</span>`;

  if(!list.length){
    content.innerHTML = `
      <div class="empty">
        <strong>No matches found</strong>
        <span>Try a different search term or filter.</span>
      </div>`;
    return;
  }

  if(state.sort === "subject"){
    const groups = new Map();
    list.forEach(r => {
      const k = r.subject || "General";
      if(!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    });
    content.innerHTML = [...groups.entries()].map(([name, items]) => `
      <section class="group" style="--h:${hueOf(name)}">
        <h2 class="group-title">${esc(name)} <span>${items.length}</span></h2>
        <div class="cards">${items.map(cardHTML).join("")}</div>
      </section>`).join("");
  } else {
    content.innerHTML = `<div class="cards">${list.map(cardHTML).join("")}</div>`;
  }

  content.querySelectorAll(".syllabus").forEach(el => {
    const card = el.closest(".card");
    if(el.scrollHeight > el.clientHeight + 6) card.classList.add("has-more");
  });
}

/* ═══════════════════════════════════════════════════════════════════
   UPCOMING BANNER
   ═══════════════════════════════════════════════════════════════════ */
function renderUpcoming(){
  const slot = $("#upcomingSlot");
  const now = Date.now();

  const upcoming = state.all
    .filter(r => r.starts && r.starts.getTime() > now)
    .sort((a,b) => a.starts - b.starts)[0];

  const liveNow = state.all.filter(r => examState(r) === "live");

  if(liveNow.length){
    const nextEnd = Math.min(...liveNow.map(r => r.starts.getTime() + LIVE_WINDOW_MS));
    slot.innerHTML = `
      <div class="upcoming" style="background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(34,211,238,.06));border-color:rgba(52,211,153,.4)">
        <div class="u-icon">🟢</div>
        <div class="u-text"><b>${liveNow.length} exam${liveNow.length>1?"s":""} live now!</b> ${esc(liveNow[0].index)} is running — jump in before the window closes.</div>
        <div class="u-cd" data-end="${nextEnd}">ends in ${fmtDuration(nextEnd - now)}</div>
      </div>`;
    return;
  }

  if(upcoming){
    slot.innerHTML = `
      <div class="upcoming">
        <div class="u-icon">📅</div>
        <div class="u-text">Next up: <b>${esc(upcoming.index)}</b> on ${upcoming.starts.toDateString()}</div>
        <div class="u-cd" data-start="${upcoming.starts.getTime()}">${fmtDuration(upcoming.starts.getTime() - now)}</div>
      </div>`;
    return;
  }

  slot.innerHTML = "";
}

/* ═══════════════════════════════════════════════════════════════════
   LIVE TICKER
   ═══════════════════════════════════════════════════════════════════ */
let needsRerender = false;
function tick(){
  const now = Date.now();

  document.querySelectorAll("[data-start]").forEach(el => {
    const start = +el.dataset.start;
    if(start <= now){ needsRerender = true; return; }
    const cd = el.querySelector(".cd");
    if(cd) cd.textContent = fmtDuration(start - now);
  });

  document.querySelectorAll("[data-end]").forEach(el => {
    const end = +el.dataset.end;
    if(end <= now){ needsRerender = true; return; }
    if(el.classList.contains("cd")) el.textContent = fmtDuration(end - now);
    else el.textContent = "ends in " + fmtDuration(end - now);
  });

  if(needsRerender){
    needsRerender = false;
    render();
    renderUpcoming();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   CALENDAR
   ═══════════════════════════════════════════════════════════════════ */
let calMonth = new Date(); calMonth.setDate(1);

function openCalendar(){
  calMonth = new Date(); calMonth.setDate(1);
  renderCalendar();
  $("#calModal").classList.add("open");
}

function shiftCalMonth(delta){
  calMonth.setMonth(calMonth.getMonth() + delta);
  renderCalendar();
}

function examsOnDay(d){
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  return state.all.filter(r => {
    if(!r.starts) return false;
    const s = r.starts;
    return s.getFullYear() === y && s.getMonth() === m && s.getDate() === day;
  });
}

function renderCalendar(){
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  $("#calTitle").textContent = calMonth.toLocaleString("en", { month:"long", year:"numeric" });

  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const isThisMonth = today.getFullYear() === y && today.getMonth() === m;

  const dows = ["S","M","T","W","T","F","S"];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");

  for(let i = 0; i < startDow; i++) html += `<div class="cal-day blank"></div>`;

  for(let day = 1; day <= daysInMonth; day++){
    const date = new Date(y, m, day);
    const list = examsOnDay(date);
    const isToday = isThisMonth && today.getDate() === day;

    let inner = `<span class="d-num">${day}</span>`;

    if(list.length){
      const shown = list.slice(0, 2);
      shown.forEach(r => {
        const st = examState(r);
        const cls = st === "live" ? "live" : (st === "locked" ? "up" : "past");
        const label = r.index || r.subject || "Exam";
        inner += `<span class="mini ${cls}" title="${esc(label)}">${esc(label)}</span>`;
      });
      if(list.length > 2){
        inner += `<span class="more">+${list.length - 2} more</span>`;
      }
    }

    const cls = ["cal-day", list.length ? "has" : "", isToday ? "today" : ""].filter(Boolean).join(" ");
    html += `<div class="${cls}" data-day="${day}">${inner}</div>`;
  }

  $("#calGrid").innerHTML = html;

  $("#calGrid").querySelectorAll(".cal-day.has").forEach(el => {
    el.addEventListener("click", () => {
      const day = +el.dataset.day;
      const date = new Date(y, m, day);
      const matches = examsOnDay(date);
      if(!matches.length) return;

      if(matches.length === 1){
        state.q = matches[0].index.toLowerCase();
        searchEl.value = matches[0].index;
      } else {
        const first = matches[0].index.split(" ")[0];
        const allSame = matches.every(r => r.index.startsWith(first));
        state.q = allSame ? first.toLowerCase() : "";
        searchEl.value = allSame ? first : "";
      }
      render();
      $("#calModal").classList.remove("open");
    });
  });
}
</script>
